<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deudas Cero - Simulador de Credito</title>
  <link rel="stylesheet" href="../../../assets/css/styles.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Credito</a></li>
        <li><a href="calculadora.html">Simulador</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Simulador de Credito</h1>
    <form>
      <label for="monto">Monto del credito ($)</label>
      <input type="number" id="monto" placeholder="Ej: 1000000">

      <label for="plazo">Plazo en meses</label>
      <input type="number" id="plazo" placeholder="Ej: 12">

      <label for="tasa">Tasa de interes anual (%)</label>
      <input type="number" id="tasa" placeholder="Ej: 45">

      <button type="submit">Simular</button>
    </form>
  </main>
</body>
</html>
