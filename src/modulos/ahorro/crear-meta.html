<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deudas Cero - Crear Meta de Ahorro</title>
  <link rel="stylesheet" href="../../../assets/css/styles.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Ahorro</a></li>
        <li><a href="crear-meta.html">Crear Meta</a></li>
        <li><a href="mis-metas.html">Mis Metas</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Crear Meta de Ahorro</h1>
    <form>
      <label for="nombre">Nombre de la meta</label>
      <input type="text" id="nombre" placeholder="Ej: Viaje a Cordoba">

      <label for="monto">Monto objetivo ($)</label>
      <input type="number" id="monto" placeholder="Ej: 200000">

      <label for="fecha">Fecha limite</label>
      <input type="date" id="fecha">

      <button type="submit">Guardar Meta</button>
    </form>
  </main>
</body>
</html>
