<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deudas Cero - Registro</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
  <main>
    <h1>Registro de Usuario</h1>
    <form id="formulario-registro" onsubmit="manejarRegistro(event)">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="email">Correo electronico</label>
      <input type="email" id="email" name="email" required>

      <label for="contrasena">Contrasena</label>
      <input type="password" id="contrasena" name="contrasena" minlength="6" required>

      <label for="confirmar_contrasena">Confirmar contrasena</label>
      <input type="password" id="confirmar_contrasena" name="confirmar_contrasena" minlength="6" required>

      <div id="mensaje" style="display:none;"></div>

      <button type="submit">Crear Cuenta</button>
      <p>Ya tenes cuenta? <a class="enlace" href="login.html">Inicia sesion aqui</a></p>
    </form>
  </main>
  <script src="../../assets/js/auth.js"></script>
  <script>
    if (sesionActiva()) {
      window.location.href = '../index.html';
    }
  </script>
</body>
</html>
